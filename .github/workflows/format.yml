name: "Check formatting"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Check C formatting
        run: make format-check

      - name: Run Go tests
        run: CGO_ENABLED=0 go test ./...

      - name: Verify make clean preserves go.mod
        run: |
          before=$(sha256sum go.mod | awk '{print $1}')
          fake=$(mktemp -d)
          cat >"$fake/Makefile" <<'EOF'
          clean:
          	rm -f "$(M)/go.mod"
          EOF
          make clean KERNEL_DIR="$fake"
          after=$(sha256sum go.mod | awk '{print $1}')
          test "$before" = "$after"
          test ! -e .go.mod.kbuild-keep

      - name: Check DKMS package layout
        run: |
          PACKAGE_VERSION=0.0.0 make dkms-tarball
          tar tzf dkms.tar.gz | grep -Fx 'dkms_source_tree/dkms.conf'
          tmp=$(mktemp -d)
          tar xzf dkms.tar.gz -C "$tmp" --strip-components=1
          test -f "$tmp/dkms.conf"
          test -f "$tmp/Makefile"

      - name: Check shell syntax
        run: bash -n scripts/*.sh
