name: "Check formatting"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Check C formatting
        run: make format-check

      - name: Run Go tests
        run: CGO_ENABLED=0 go test ./...

      - name: Check clock and browser metrics regressions
        run: |
          cc -O2 -Wall -Wextra -Werror tools/clock-test.c -o /tmp/brutal-clock-test
          /tmp/brutal-clock-test
          node --check web/app.js
          node tools/web-metrics-test.cjs
          node tools/web-session-test.cjs
          python3 -m py_compile scripts/review-benchmark.py scripts/review-kernel-regression.py scripts/review-transfer.py scripts/review-summarize.py scripts/review-selfcheck.py
          python3 scripts/review-summarize.py --self-test

      - name: Compile kernel module
        run: |
          sudo apt-get install -y linux-headers-generic
          headers=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$headers"
          make KERNEL_DIR="$headers"

      - name: Verify make clean preserves go.mod
        run: |
          before=$(sha256sum go.mod | awk '{print $1}')
          fake=$(mktemp -d)
          cat >"$fake/Makefile" <<'EOF'
          clean:
          	rm -f "$(M)/go.mod"
          EOF
          make clean KERNEL_DIR="$fake"
          after=$(sha256sum go.mod | awk '{print $1}')
          test "$before" = "$after"
          test ! -e .go.mod.kbuild-keep

      - name: Check DKMS package layout
        run: |
          PACKAGE_VERSION=0.0.0 make dkms-tarball
          tar tzf dkms.tar.gz | grep -Fx 'dkms_source_tree/dkms.conf'
          tmp=$(mktemp -d)
          tar xzf dkms.tar.gz -C "$tmp" --strip-components=1
          test -f "$tmp/dkms.conf"
          test -f "$tmp/Makefile"

      - name: Check shell syntax
        run: bash -n scripts/*.sh
