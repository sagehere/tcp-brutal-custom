name: Release TCP Brutal Custom

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Check release version
        run: |
          version=$(./scripts/mkdkmsconf.sh | sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Check Go code
        run: go test ./...
      - name: Package binaries and DKMS source
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME#v}" -o build/tcp-brutal-custom-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME#v}" -o build/tcp-brutal-custom-linux-arm64 .
          make dkms-tarball
          mv dkms.tar.gz build/tcp-brutal-custom.dkms.tar.gz
          cp scripts/install.sh build/install.sh
          cd build
          sha256sum tcp-brutal-custom-linux-amd64 tcp-brutal-custom-linux-arm64 tcp-brutal-custom.dkms.tar.gz install.sh > hashes.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*
