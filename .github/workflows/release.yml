name: Stage TCP Brutal Custom release

on:
  push:
    branches: ["release-stage/v*.*.*"]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release-stage/}"
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_version=$(sed -nE 's/^#define BRUTAL_VERSION_(MAJOR|MINOR|PATCH)[[:space:]]+([0-9]+).*/\2/p' brutal.h | paste -sd.)
          test "$source_version" = "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check source
        run: |
          CGO_ENABLED=0 go test ./...
          cc -O2 -Wall -Wextra -Werror tools/clock-test.c -o /tmp/brutal-clock-test
          /tmp/brutal-clock-test
          node --check web/app.js
          node tools/web-metrics-test.cjs
          python3 scripts/review-summarize.py --self-test
          bash -n scripts/*.sh

      - name: Build unsigned release bundle
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          mkdir -p build
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$version" -o build/tcp-brutal-custom-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=$version" -o build/tcp-brutal-custom-linux-arm64 .
          PACKAGE_VERSION="$version" make dkms-tarball
          mv dkms.tar.gz build/tcp-brutal-custom.dkms.tar.gz
          cp scripts/install.sh build/install.sh
          cp scripts/bootstrap.sh build/bootstrap.sh
          printf 'tag=%s\nsource_sha=%s\n' "$tag" "$(git rev-parse HEAD)" > build/release.txt
          cd build
          sha256sum \
            tcp-brutal-custom-linux-amd64 \
            tcp-brutal-custom-linux-arm64 \
            tcp-brutal-custom.dkms.tar.gz \
            install.sh bootstrap.sh release.txt > hashes.txt
          sha256sum -c hashes.txt

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 7
